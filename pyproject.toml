[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pql"
version = "0.1.0"
description = "Personal Quant Lab - reproducible quant research system for China ETFs"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3,<4",
    "vectorbt>=1.1.0,<2",
    "scipy>=1.15",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "pyyaml>=6.0",
    "pyarrow>=17",
]

[project.optional-dependencies]
data = ["akshare>=1.18", "tushare>=1.4.29"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
pql = "pql.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pql"]

[tool.pytest.ini_options]
testpaths = ["tests"]